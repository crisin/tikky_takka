<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mehrere Timer gleichzeitig – alles lokal auf dem Gerät.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tikky Takka">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#161618">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tikky Takka</title>
  <link rel="manifest" href="manifest.json">
  <!-- Same color as the app background: no white flash while loading. -->
  <style>html, body { margin: 0; background: #161618; }</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline support (web/sw.js). After loading, tell the worker which
    // files this start used, so the CanvasKit variant this browser picked
    // is cached as well.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register('sw.js');
          const worker = (await navigator.serviceWorker.ready).active;
          const report = () => worker && worker.postMessage({
            type: 'cache',
            urls: performance.getEntriesByType('resource')
              .map((entry) => entry.name.split('#')[0])
              .filter((url) => url.startsWith(location.origin)),
          });
          // CanvasKit and the database worker load after the page itself.
          setTimeout(report, 5000);
        } catch (error) {
          console.warn('Service worker not registered:', error);
        }
      });
    }
    // Installed (home screen): ask the browser to keep the data. Granted
    // without a prompt there; in a plain tab it could ask, so not there.
    if (navigator.storage && navigator.storage.persist &&
        matchMedia('(display-mode: standalone)').matches) {
      navigator.storage.persist();
    }
  </script>
</body>
</html>
