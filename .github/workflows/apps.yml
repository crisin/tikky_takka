# Native builds for testing on real devices.
#
# * iOS: on every push a build without signing (does it still compile on
#   macOS / Xcode?). Started by hand ("Run workflow", testflight = true)
#   and with the App Store Connect secrets in place, the build is signed
#   and uploaded to TestFlight.
# * Android: a release APK as a build artifact (signed with the upload key
#   when its secrets exist, otherwise with a throwaway debug key).
#
# Secrets and the one-time setup: README, "Auf echten Geräten testen".
# Nothing signed is ever uploaded as an artifact; the IPA only goes to
# App Store Connect.
name: Apps

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      testflight:
        description: 'iOS-Build signieren und zu TestFlight hochladen'
        type: boolean
        default: true

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  BUNDLE_ID: dev.tikkytakka.tikkyTakka
  # Shown on the diagnostics page in the app.
  DART_DEFINES: >-
    --dart-define=BUILD_NUMBER=${{ github.run_number }}
    --dart-define=GIT_SHA=${{ github.sha }}

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' && secrets.CERTIFICATE_PRIVATE_KEY != '' }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build without signing
        if: env.UPLOAD != 'true'
        run: flutter build ios --release --no-codesign $DART_DEFINES

      - name: Signing secrets missing
        if: env.UPLOAD == 'true' && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::App Store Connect secrets fehlen (README, 'Auf echten Geräten testen')."
          exit 1

      # Certificate and App Store profile are fetched, or created on the
      # first run, through the App Store Connect API (codemagic-cli-tools).
      # The certificate key stays the same (CERTIFICATE_PRIVATE_KEY), so
      # every run reuses the same distribution certificate.
      - name: Signing
        if: env.UPLOAD == 'true'
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        if: env.UPLOAD == 'true'
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist" \
            $DART_DEFINES

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: app-store-connect publish --path build/ios/ipa/*.ipa

      - name: Clean up keychain
        if: always() && env.UPLOAD == 'true'
        run: keychain use-login || true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=../upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            $DART_DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: tikky-takka-${{ github.run_number }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
